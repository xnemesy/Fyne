name: fyne_frontend
description: A new Flutter project for Fyne Banking.
version: 1.1.0+12
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.2
  firebase_crashlytics: ^5.0.7
  google_sign_in: 6.2.1
  sign_in_with_apple: ^7.0.1

  # Cryptography
  crypto: ^3.0.3

  # Networking
  dio: ^5.3.3

  # State Management (Stable 2.x)
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Encryption & Recovery
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  bip39: ^1.0.6

  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.11.1

  # Local Storage (Isar Community Fork - Analyzer 6.0+ Support)
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  path_provider: ^2.1.1

  # UI & Charts
  fl_chart: ^1.1.1
  google_fonts: ^8.0.1
  shimmer: ^3.0.0
  animations: ^2.0.11
  cupertino_icons: ^1.0.6
  lucide_icons: ^0.257.0

  # Biometrics & Export
  local_auth: ^3.0.0
  csv: ^7.1.0
  share_plus: ^12.0.1
  file_picker: ^10.3.10
  uuid: ^4.2.1
  image_picker: ^1.0.4
  flutter_local_notifications: ^17.2.2
  intl: ^0.20.2
  timezone: ^0.9.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.0.0
  proximity_sensor: ^1.3.9
  sensors_plus: ^7.0.0
  visibility_detector: ^0.4.0+2
  shared_preferences: ^2.2.2
  crypton: ^2.2.1
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  riverpod_generator: ^3.0.3
  isar_community_generator: ^3.3.0

flutter:
  uses-material-design: true

dependency_overrides:
  analyzer: ">=8.1.1 <8.3.0"
  custom_lint_core: 0.8.1
  custom_lint_visitor: 1.0.0+8.0.0
